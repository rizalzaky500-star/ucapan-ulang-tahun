<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Pengaturan Ulang Tahun</title>
  <!-- CDN Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    [hidden] {
      display: none !important;
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

  <section id="loginPanel" class="bg-white p-8 rounded-2xl shadow-xl max-w-md w-full" aria-labelledby="loginTitle">
    <div class="flex justify-between items-center mb-6">
      <h1 id="loginTitle" class="text-2xl font-bold text-gray-800">Admin Panel</h1>
      <a href="/halaman.html" class="text-xs bg-gray-200 hover:bg-gray-300 text-gray-700 px-3 py-1.5 rounded-lg transition">
        &larr; Kembali
      </a>
    </div>

    <p id="loginDescription" class="text-sm text-gray-600 mb-5">Masukkan password untuk membuka pengaturan.</p>

    <form id="loginForm" class="space-y-4">
      <div>
        <label for="passwordInput" class="block text-sm font-medium text-gray-700 mb-1">Password Admin</label>
        <input type="password" id="passwordInput" required minlength="6" autocomplete="current-password"
          class="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-purple-500 focus:outline-none text-gray-800">
      </div>

      <div id="confirmPasswordField" hidden>
        <label for="confirmPasswordInput" class="block text-sm font-medium text-gray-700 mb-1">Ulangi Password</label>
        <input type="password" id="confirmPasswordInput" minlength="6" autocomplete="new-password"
          class="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-purple-500 focus:outline-none text-gray-800">
      </div>

      <button id="loginButton" type="submit" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-semibold py-2.5 rounded-xl shadow-md transition">
        Masuk
      </button>
    </form>

    <p id="loginStatus" class="hidden mt-4 p-3 text-sm rounded-lg" role="status" aria-live="polite"></p>
    <p class="mt-5 text-xs text-amber-700 bg-amber-50 border border-amber-200 rounded-lg p-3">
      Catatan: password ini hanya gerbang sederhana di browser ini, bukan keamanan server. Jangan gunakan password penting atau sama dengan akun lain.
    </p>
  </section>

  <section id="adminPanel" class="hidden bg-white p-8 rounded-2xl shadow-xl max-w-md w-full" aria-labelledby="adminTitle">
    <div class="flex justify-between items-center mb-6">
      <h1 id="adminTitle" class="text-2xl font-bold text-gray-800">Admin Panel</h1>
      <a href="/halaman.html" class="text-xs bg-gray-200 hover:bg-gray-300 text-gray-700 px-3 py-1.5 rounded-lg transition">
        &larr; Lihat Tampilan
      </a>
    </div>

    <!-- Alert Notifikasi -->
    <p id="alert" class="hidden mb-4 p-3 bg-green-100 border border-green-400 text-green-700 text-sm rounded-lg" role="status" aria-live="polite">
      Data berhasil diperbarui!
    </p>
    <p id="adminStatus" class="hidden mb-4 p-3 bg-red-100 border border-red-400 text-red-700 text-sm rounded-lg" role="alert"></p>

    <!-- Form Pengaturan -->
    <form id="adminForm" class="space-y-4">
      <div>
        <label for="inputName" class="block text-sm font-medium text-gray-700 mb-1">Nama Yang Ulang Tahun</label>
        <input type="text" id="inputName" required class="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-purple-500 focus:outline-none text-gray-800">
      </div>

      <div>
        <label for="inputAge" class="block text-sm font-medium text-gray-700 mb-1">Umur (Tahun)</label>
        <input type="number" id="inputAge" min="1" max="150" required class="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-purple-500 focus:outline-none text-gray-800">
      </div>

      <div class="pt-2">
        <button type="submit" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-semibold py-2.5 rounded-xl shadow-md transition">
          Simpan Perubahan
        </button>
      </div>
    </form>

    <button id="logoutButton" type="button" class="w-full mt-4 bg-gray-100 hover:bg-gray-200 text-gray-700 font-medium py-2.5 rounded-xl transition">
      Kunci Admin
    </button>
  </section>

  <script>
    const nameInput = document.getElementById('inputName');
    const ageInput = document.getElementById('inputAge');
    const adminForm = document.getElementById('adminForm');
    const alertBox = document.getElementById('alert');
    const adminStatus = document.getElementById('adminStatus');
    const loginPanel = document.getElementById('loginPanel');
    const loginForm = document.getElementById('loginForm');
    const loginTitle = document.getElementById('loginTitle');
    const loginDescription = document.getElementById('loginDescription');
    const loginStatus = document.getElementById('loginStatus');
    const loginButton = document.getElementById('loginButton');
    const passwordInput = document.getElementById('passwordInput');
    const confirmPasswordField = document.getElementById('confirmPasswordField');
    const confirmPasswordInput = document.getElementById('confirmPasswordInput');
    const adminPanel = document.getElementById('adminPanel');
    const logoutButton = document.getElementById('logoutButton');
    const credentialKey = 'birthdayAdminCredential';

    function showStatus(element, message, isError) {
      element.textContent = message;
      element.classList.remove('hidden', 'bg-red-100', 'border-red-400', 'text-red-700', 'bg-green-100', 'border-green-400', 'text-green-700');
      element.classList.add(
        isError ? 'bg-red-100' : 'bg-green-100',
        isError ? 'border-red-400' : 'border-green-400',
        isError ? 'text-red-700' : 'text-green-700'
      );
    }

    function setLoginMode(isFirstVisit) {
      confirmPasswordField.hidden = !isFirstVisit;
      confirmPasswordInput.required = isFirstVisit;
      passwordInput.autocomplete = isFirstVisit ? 'new-password' : 'current-password';
      loginTitle.textContent = isFirstVisit ? 'Buat Password Admin' : 'Admin Panel';
      loginDescription.textContent = isFirstVisit
        ? 'Buat password minimal 6 karakter. Password hanya tersimpan di browser ini.'
        : 'Masukkan password untuk membuka pengaturan.';
      loginButton.textContent = isFirstVisit ? 'Simpan Password & Buka Admin' : 'Masuk';
    }

    async function createPasswordDigest(password, salt) {
      const data = new TextEncoder().encode(`${salt}:${password}`);
      const digest = await crypto.subtle.digest('SHA-256', data);
      return Array.from(new Uint8Array(digest), (byte) => byte.toString(16).padStart(2, '0')).join('');
    }

    function unlockAdmin() {
      try {
        nameInput.value = localStorage.getItem('birthdayName') || 'Budi Utomo';
        ageInput.value = localStorage.getItem('birthdayAge') || '20';
      } catch (error) {
        showStatus(adminStatus, `Tidak dapat membaca pengaturan dari penyimpanan browser: ${error.message}`, true);
      }
      loginPanel.hidden = true;
      adminPanel.hidden = false;
      nameInput.focus();
    }

    try {
      setLoginMode(!localStorage.getItem(credentialKey));
    } catch (error) {
      loginButton.disabled = true;
      showStatus(loginStatus, `Penyimpanan browser tidak tersedia: ${error.message}`, true);
    }

    loginForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      loginButton.disabled = true;
      loginStatus.classList.add('hidden');

      try {
        if (!crypto.subtle) {
          throw new Error('Fitur kriptografi tidak tersedia. Buka halaman melalui HTTPS atau localhost.');
        }

        const password = passwordInput.value;
        const storedCredential = localStorage.getItem(credentialKey);

        if (storedCredential) {
          let credential;
          try {
            credential = JSON.parse(storedCredential);
          } catch {
            throw new Error('Data password rusak. Hapus kunci birthdayAdminCredential dari localStorage untuk mengatur ulang.');
          }

          if (typeof credential.salt !== 'string' || typeof credential.digest !== 'string') {
            throw new Error('Data password tidak valid. Hapus kunci birthdayAdminCredential dari localStorage untuk mengatur ulang.');
          }

          const digest = await createPasswordDigest(password, credential.salt);
          if (digest !== credential.digest) {
            showStatus(loginStatus, 'Password salah. Silakan coba lagi.', true);
            passwordInput.value = '';
            passwordInput.focus();
            return;
          }
        } else {
          if (password.length < 6) {
            showStatus(loginStatus, 'Password harus minimal 6 karakter.', true);
            passwordInput.focus();
            return;
          }

          if (password !== confirmPasswordInput.value) {
            showStatus(loginStatus, 'Konfirmasi password tidak sama.', true);
            confirmPasswordInput.value = '';
            confirmPasswordInput.focus();
            return;
          }

          const saltBytes = crypto.getRandomValues(new Uint8Array(16));
          const salt = Array.from(saltBytes, (byte) => byte.toString(16).padStart(2, '0')).join('');
          const digest = await createPasswordDigest(password, salt);
          localStorage.setItem(credentialKey, JSON.stringify({ salt, digest }));
        }

        passwordInput.value = '';
        confirmPasswordInput.value = '';
        unlockAdmin();
      } catch (error) {
        showStatus(loginStatus, `Tidak dapat memproses password: ${error.message}`, true);
      } finally {
        loginButton.disabled = false;
      }
    });

    adminForm.addEventListener('submit', (event) => {
      event.preventDefault();
      adminStatus.classList.add('hidden');

      const name = nameInput.value.trim();
      const age = Number(ageInput.value);
      if (!name || !Number.isInteger(age) || age < 1 || age > 150) {
        showStatus(adminStatus, 'Masukkan nama dan umur yang valid (1–150 tahun).', true);
        return;
      }

      try {
        localStorage.setItem('birthdayName', name);
        localStorage.setItem('birthdayAge', String(age));
        showStatus(alertBox, 'Data berhasil diperbarui!', false);
      } catch (error) {
        showStatus(adminStatus, `Tidak dapat menyimpan pengaturan: ${error.message}`, true);
      }
    });

    logoutButton.addEventListener('click', () => {
      adminPanel.hidden = true;
      loginPanel.hidden = false;
      setLoginMode(false);
      passwordInput.focus();
    });
  </script>
</body>
</html>
