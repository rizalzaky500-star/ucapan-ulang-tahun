<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Pengaturan Ulang Tahun</title>
  <!-- CDN Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

  <section id="adminPanel" class="bg-white p-8 rounded-2xl shadow-xl max-w-md w-full" aria-labelledby="adminTitle">
    <div class="flex justify-between items-center mb-6">
      <h1 id="adminTitle" class="text-2xl font-bold text-gray-800">Admin Panel</h1>
      <a href="/halaman.html" class="text-xs bg-gray-200 hover:bg-gray-300 text-gray-700 px-3 py-1.5 rounded-lg transition">
        &larr; Lihat Tampilan
      </a>
    </div>
    <button id="logoutButton" type="button" class="hidden mb-4 text-sm text-purple-700 hover:text-purple-900 underline">
      Keluar dari admin
    </button>

    <!-- Alert Notifikasi -->
    <p id="alert" class="hidden mb-4 p-3 bg-green-100 border border-green-400 text-green-700 text-sm rounded-lg" role="status" aria-live="polite">
      Data berhasil diperbarui!
    </p>
    <p id="adminStatus" class="hidden mb-4 p-3 bg-red-100 border border-red-400 text-red-700 text-sm rounded-lg" role="alert"></p>

    <form id="loginForm" class="space-y-4">
      <div>
        <label for="adminPassword" class="block text-sm font-medium text-gray-700 mb-1">Kata Sandi Admin</label>
        <input type="password" id="adminPassword" required autocomplete="current-password" class="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-purple-500 focus:outline-none text-gray-800">
      </div>
      <button type="submit" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-semibold py-2.5 rounded-xl shadow-md transition">
        Masuk
      </button>
    </form>

    <!-- Form Pengaturan -->
    <form id="adminForm" class="hidden space-y-4">
      <div>
        <label for="inputName" class="block text-sm font-medium text-gray-700 mb-1">Nama Yang Ulang Tahun</label>
        <input type="text" id="inputName" maxlength="100" required class="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-purple-500 focus:outline-none text-gray-800">
      </div>

      <div>
        <label for="inputAge" class="block text-sm font-medium text-gray-700 mb-1">Umur (Tahun)</label>
        <input type="number" id="inputAge" min="1" max="150" required class="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-purple-500 focus:outline-none text-gray-800">
      </div>

      <div class="pt-2">
        <button type="submit" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-semibold py-2.5 rounded-xl shadow-md transition">
          Simpan Perubahan
        </button>
      </div>
    </form>

  </section>

  <script>
    const nameInput = document.getElementById('inputName');
    const ageInput = document.getElementById('inputAge');
    const adminForm = document.getElementById('adminForm');
    const loginForm = document.getElementById('loginForm');
    const adminPassword = document.getElementById('adminPassword');
    const logoutButton = document.getElementById('logoutButton');
    const alertBox = document.getElementById('alert');
    const adminStatus = document.getElementById('adminStatus');

    function showStatus(element, message, isError) {
      element.textContent = message;
      element.classList.remove('hidden', 'bg-red-100', 'border-red-400', 'text-red-700', 'bg-green-100', 'border-green-400', 'text-green-700');
      element.classList.add(
        isError ? 'bg-red-100' : 'bg-green-100',
        isError ? 'border-red-400' : 'border-green-400',
        isError ? 'text-red-700' : 'text-green-700'
      );
    }

    async function readApiResponse(response) {
      const contentType = response.headers.get('content-type') || '';
      if (!contentType.includes('application/json')) {
        throw new Error(`API mengembalikan respons non-JSON (HTTP ${response.status}). Periksa konfigurasi dan deploy function Vercel.`);
      }
      return response.json();
    }

    async function loadSettings() {
      try {
        const sessionResponse = await fetch('/api/session');
        const session = await readApiResponse(sessionResponse);
        if (!sessionResponse.ok) {
          throw new Error(session.error || 'Status admin tidak dapat diperiksa.');
        }
        if (!session.authenticated) {
          loginForm.classList.remove('hidden');
          adminForm.classList.add('hidden');
          logoutButton.classList.add('hidden');
          return;
        }

        loginForm.classList.add('hidden');
        adminForm.classList.remove('hidden');
        logoutButton.classList.remove('hidden');
        const response = await fetch('/api/settings');
        const settings = await readApiResponse(response);
        if (!response.ok) {
          throw new Error(settings.error || 'Pengaturan tidak dapat dimuat.');
        }
        nameInput.value = settings.name;
        ageInput.value = settings.age;
      } catch (error) {
        showStatus(adminStatus, `Gagal memuat pengaturan: ${error.message}`, true);
      }
    }

    loadSettings();

    loginForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      adminStatus.classList.add('hidden');

      try {
        const response = await fetch('/api/session', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: adminPassword.value }),
        });
        const result = await readApiResponse(response);
        if (!response.ok) {
          throw new Error(result.error || 'Tidak dapat masuk sebagai admin.');
        }
        adminPassword.value = '';
        await loadSettings();
      } catch (error) {
        showStatus(adminStatus, error.message, true);
      }
    });

    logoutButton.addEventListener('click', async () => {
      try {
        const response = await fetch('/api/session', { method: 'DELETE' });
        const result = await readApiResponse(response);
        if (!response.ok) {
          throw new Error(result.error || 'Tidak dapat keluar dari admin.');
        }
        adminForm.classList.add('hidden');
        logoutButton.classList.add('hidden');
        loginForm.classList.remove('hidden');
        showStatus(alertBox, 'Anda telah keluar dari admin.', false);
      } catch (error) {
        showStatus(adminStatus, error.message, true);
      }
    });

    adminForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      adminStatus.classList.add('hidden');

      const name = nameInput.value.trim();
      const age = Number(ageInput.value);
      if (!name || !Number.isInteger(age) || age < 1 || age > 150) {
        showStatus(adminStatus, 'Masukkan nama dan umur yang valid (1–150 tahun).', true);
        return;
      }

      try {
        const response = await fetch('/api/settings', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, age }),
        });
        const result = await readApiResponse(response);
        if (!response.ok) {
          throw new Error(result.error || 'Pengaturan tidak dapat disimpan.');
        }
        showStatus(alertBox, 'Data berhasil diperbarui!', false);
      } catch (error) {
        showStatus(adminStatus, `Tidak dapat menyimpan pengaturan: ${error.message}`, true);
      }
    });

  </script>
</body>
</html>
