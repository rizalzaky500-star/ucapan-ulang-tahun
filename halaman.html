<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Selamat Ulang Tahun!</title>
  <!-- CDN Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Canvas Confetti untuk efek kembang api/serbuk warna-warni -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    body {
      isolation: isolate;
      background: linear-gradient(135deg, #fb7185, #a855f7 52%, #6366f1);
      background-size: 180% 180%;
      animation: background-shift 12s ease-in-out infinite alternate;
    }

    .birthday-card {
      animation: card-arrive 800ms cubic-bezier(.2, .8, .2, 1) both,
        card-float 5s ease-in-out 800ms infinite;
    }

    .birthday-card::before {
      position: absolute;
      inset: -45% auto auto -25%;
      width: 150%;
      height: 65%;
      content: "";
      background: linear-gradient(110deg, transparent 35%, rgb(255 255 255 / 45%) 50%, transparent 65%);
      transform: rotate(-12deg);
      animation: card-shine 7s ease-in-out 1.2s infinite;
      pointer-events: none;
    }

    .birthday-icon {
      display: inline-block;
      transform-origin: 50% 80%;
      animation: party-bounce 1.8s ease-in-out infinite;
    }

    .balloon {
      position: fixed;
      z-index: -1;
      bottom: -150px;
      left: var(--balloon-left);
      width: 54px;
      height: 68px;
      border-radius: 50% 50% 46% 46%;
      background: var(--balloon-color);
      box-shadow: inset -8px -7px 0 rgb(0 0 0 / 8%), inset 9px 8px 0 rgb(255 255 255 / 25%);
      animation: balloon-rise var(--balloon-duration) linear var(--balloon-delay) infinite;
      pointer-events: none;
    }

    .balloon::before {
      position: absolute;
      bottom: -6px;
      left: 23px;
      width: 10px;
      height: 10px;
      content: "";
      background: inherit;
      clip-path: polygon(0 0, 100% 0, 50% 100%);
    }

    .balloon::after {
      position: absolute;
      top: 75px;
      left: 27px;
      width: 1px;
      height: 110px;
      content: "";
      background: rgb(255 255 255 / 55%);
    }

    .sparkle {
      position: fixed;
      z-index: -1;
      left: var(--sparkle-left);
      top: var(--sparkle-top);
      color: white;
      font-size: 24px;
      animation: sparkle 2.2s ease-in-out var(--sparkle-delay) infinite;
      pointer-events: none;
    }

    @keyframes background-shift {
      to { background-position: 100% 100%; }
    }

    @keyframes card-arrive {
      from { opacity: 0; transform: translateY(35px) scale(.94); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes card-float {
      0%, 100% { translate: 0 0; }
      50% { translate: 0 -8px; }
    }

    @keyframes card-shine {
      0%, 65%, 100% { translate: -120% 0; }
      30% { translate: 120% 0; }
    }

    @keyframes party-bounce {
      0%, 100% { transform: rotate(-5deg) scale(1); }
      50% { transform: rotate(5deg) scale(1.12); }
    }

    @keyframes balloon-rise {
      0% { transform: translateY(0) rotate(-8deg); }
      50% { transform: translateY(-55vh) rotate(8deg); }
      100% { transform: translateY(-115vh) rotate(-8deg); }
    }

    @keyframes sparkle {
      0%, 100% { opacity: .25; transform: scale(.7) rotate(0); }
      50% { opacity: 1; transform: scale(1.2) rotate(18deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body class="bg-gradient-to-br from-pink-400 via-purple-500 to-indigo-600 min-h-screen flex items-center justify-center p-4">

  <div class="balloon" style="--balloon-left: 8%; --balloon-color: #fda4af; --balloon-duration: 17s; --balloon-delay: -9s" aria-hidden="true"></div>
  <div class="balloon" style="--balloon-left: 82%; --balloon-color: #facc15; --balloon-duration: 20s; --balloon-delay: -14s" aria-hidden="true"></div>
  <div class="balloon" style="--balloon-left: 92%; --balloon-color: #67e8f9; --balloon-duration: 18s; --balloon-delay: -5s" aria-hidden="true"></div>
  <span class="sparkle" style="--sparkle-left: 18%; --sparkle-top: 20%; --sparkle-delay: -.5s" aria-hidden="true">✦</span>
  <span class="sparkle" style="--sparkle-left: 78%; --sparkle-top: 72%; --sparkle-delay: -1.4s" aria-hidden="true">✧</span>
  <span class="sparkle" style="--sparkle-left: 88%; --sparkle-top: 18%; --sparkle-delay: -.9s" aria-hidden="true">✦</span>

  <!-- Card Ucapan Ulang Tahun -->
  <div class="birthday-card bg-white/90 backdrop-blur-md p-8 md:p-12 rounded-3xl shadow-2xl text-center max-w-lg w-full relative overflow-hidden transform hover:scale-105 transition-all duration-300">
    
    <!-- Tombol ke Halaman Admin (Ikon Gear) -->
    <a href="admin.html" title="Pengaturan Admin" class="absolute top-4 right-4 text-gray-500 hover:text-purple-600 transition">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
      </svg>
    </a>

    <!-- Ilustrasi / Emoji -->
    <div class="birthday-icon text-6xl mb-4" aria-hidden="true">🎉🎂🥳</div>

    <h2 class="text-xl font-medium text-gray-600 uppercase tracking-widest mb-1">Selamat Ulang Tahun</h2>
    
    <!-- Dynamic Name & Age -->
    <h1 id="displayName" class="text-4xl md:text-5xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-pink-500 to-purple-600 mb-2">
      Loading...
    </h1>
    
    <p class="text-lg text-gray-700 font-semibold mb-6">
      Yang ke- <span id="displayAge" class="text-3xl font-bold text-indigo-600">--</span> Tahun! ✨
    </p>

    <!-- Pesan Singkat -->
    <p class="text-gray-600 text-sm leading-relaxed mb-8">
      Semoga di usia yang baru ini kamu semakin sehat, panjang umur, dan semua impian serta cita-citamu dapat tercapai. Tetaplah menjadi orang yang baik dan ceria! ❤️
    </p>

    <!-- Tombol Efek Kembang Api -->
    <button onclick="launchConfetti()" class="w-full bg-gradient-to-r from-pink-500 to-purple-600 hover:from-pink-600 hover:to-purple-700 text-white font-bold py-3 px-6 rounded-xl shadow-lg transform active:scale-95 transition">
      Tiup Lilin & Rayakan! 🎊
    </button>

    <p class="text-xs text-gray-400 mt-4">Hari spesialmu pantas dirayakan! 💖</p>

  </div>

  <script>
    // Membaca data dari localStorage atau menggunakan nilai default
    function loadData() {
      const name = localStorage.getItem('birthdayName') || 'Budi Utomo';
      const age = localStorage.getItem('birthdayAge') || '20';

      document.getElementById('displayName').innerText = name;
      document.getElementById('displayAge').innerText = age;
    }

    // Efek Confetti (Kembang api serbuk)
    function launchConfetti() {
      confetti({
        particleCount: 100,
        spread: 70,
        origin: { y: 0.6 }
      });
    }

    // Jalankan saat pertama dimuat
    loadData();

    // Sinkronisasi live: jika admin menyimpan data di tab lain, halaman ikut diperbarui
    window.addEventListener('storage', (e) => {
      if (e.key === 'birthdayName' || e.key === 'birthdayAge') {
        loadData();
        launchConfetti();
      }
    });
    // Otomatis menembakkan confetti di awal
    setTimeout(launchConfetti, 500);
  </script>
</body>
</html>
